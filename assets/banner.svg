<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="hikoutai-stamp banner">
  <defs>
    <!-- 背景斜纹 -->
    <pattern id="diag" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#141a22"/>
    </pattern>
    <!-- 顶部危险条纹（金黑相间） -->
    <pattern id="hazard" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#d4a84b"/>
      <rect x="9" width="9" height="18" fill="#111418"/>
    </pattern>
    <!-- 金色光晕 -->
    <radialGradient id="glow" cx="80%" cy="112%" r="72%">
      <stop offset="0" stop-color="#d4a84b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d4a84b" stop-opacity="0"/>
    </radialGradient>
    <!-- 战机剪影 -->
    <g id="jet">
      <path fill="#e8edf4" stroke="#e8edf4" stroke-width="4" stroke-linejoin="round"
            d="M120 16 L127 60 L129 92 L212 152 L212 162 L136 146 L134 168 L196 200 L196 208 L132 204 L128 222
               L112 222 L108 204 L44 208 L44 200 L106 168 L104 146 L28 162 L28 152 L111 92 L113 60 Z"/>
      <!-- 尾迹速度线 -->
      <rect x="80" y="236" width="80" height="7" fill="#d4a84b"/>
      <rect x="92" y="254" width="56" height="6" fill="#d4a84b" opacity=".7"/>
      <rect x="100" y="271" width="40" height="5" fill="#d4a84b" opacity=".45"/>
    </g>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="1280" height="400" fill="#0e1116"/>
  <rect width="1280" height="400" fill="url(#diag)" opacity=".55"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="7" fill="url(#hazard)"/>

  <!-- 取景框四角角标 -->
  <g fill="none" stroke="#d4a84b" stroke-width="3" opacity=".85">
    <path d="M28 88 L28 28 L88 28"/>
    <path d="M1192 28 L1252 28 L1252 88"/>
    <path d="M1252 312 L1252 372 L1192 372"/>
    <path d="M88 372 L28 372 L28 312"/>
  </g>
  <!-- 右上准星 -->
  <g stroke="#d4a84b" stroke-width="2" opacity=".55">
    <path d="M1160 54 L1160 74 M1150 64 L1170 64"/>
  </g>

  <!-- ===== 右侧战机剪影 ===== -->
  <g transform="translate(1020,178) rotate(-18) scale(1.55) translate(-120,-119)">
    <use href="#jet"/>
  </g>

  <!-- ===== 左侧文案 ===== -->
  <!-- 顶部「対象機」标签条 -->
  <rect x="96" y="74" width="452" height="44" fill="#000000" stroke="#2c3542" stroke-width="1"/>
  <text x="322" y="103" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="21" font-weight="700" letter-spacing="2" fill="#ffffff">対 象 機（スタイル模写ツール）</text>

  <!-- 主标题 -->
  <text x="94" y="216" font-family="'Noto Sans JP','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="94" font-weight="900" letter-spacing="-2" fill="#ffffff">hikoutai<tspan fill="#d4a84b">-stamp</tspan></text>

  <!-- 金色下划线 -->
  <rect x="96" y="240" width="150" height="6" fill="#d4a84b"/>

  <!-- 副标题 -->
  <text x="96" y="286" font-family="'Noto Sans JP','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="24" font-weight="500" fill="#aab6c6">航空自衛隊公開写真スタイルの画像ラベリングツール</text>

  <!-- 特性 chips -->
  <g font-family="'Noto Sans JP','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
     font-size="15" font-weight="700" fill="#d4a84b">
    <rect x="96"  y="312" width="118" height="34" rx="17" fill="none" stroke="#3a4553"/>
    <text x="155" y="334" text-anchor="middle">単一ファイル</text>
    <rect x="226" y="312" width="106" height="34" rx="17" fill="none" stroke="#3a4553"/>
    <text x="279" y="334" text-anchor="middle">ゼロ依存</text>
    <rect x="344" y="312" width="118" height="34" rx="17" fill="none" stroke="#3a4553"/>
    <text x="403" y="334" text-anchor="middle">ローカル処理</text>
  </g>

  <!-- 右下角署名章（母题） -->
  <g>
    <rect x="948" y="330" width="272" height="38" fill="#000000" opacity=".92"/>
    <rect x="948" y="330" width="6" height="38" fill="#d4a84b"/>
    <text x="1090" y="355" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
          font-size="17" font-weight="700" letter-spacing="1" fill="#ffffff">航空自衛隊撮影 スタイル</text>
  </g>
</svg>
