<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="hikoutai-stamp logo">
  <!-- hikoutai-stamp · 対象機标签条 + 战机剪影 + 右下署名章 三大母题 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181d25"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#bg)" stroke="#2c3542" stroke-width="2"/>

  <!-- 顶部「対象機」标签条（黑字白底 · light theme 母题） -->
  <rect x="14" y="14" width="100" height="26" rx="3" fill="#ffffff"/>
  <text x="64" y="32" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
        font-size="15" font-weight="700" letter-spacing="4" fill="#111111">対象機</text>

  <!-- 战机俯视剪影 -->
  <g transform="translate(22,44) scale(0.35)">
    <path fill="#e8edf4" stroke="#e8edf4" stroke-width="4" stroke-linejoin="round"
          d="M120 16 L127 60 L129 92 L212 152 L212 162 L136 146 L134 168 L196 200 L196 208 L132 204 L128 222
             L112 222 L108 204 L44 208 L44 200 L106 168 L104 146 L28 162 L28 152 L111 92 L113 60 Z"/>
  </g>

  <!-- 右下角署名章（金色点缀 · credit 母题） -->
  <rect x="86" y="100" width="28" height="14" rx="2" fill="#d4a84b"/>
  <rect x="90" y="105" width="20" height="4" fill="#111111" opacity=".75"/>
</svg>
